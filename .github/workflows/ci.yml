name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

permissions:
  contents: read

env:
  PNPM_VERSION: "10.30.3"
  OPENSPEC_VERSION: "1.14.0"
  GITLEAKS_VERSION: "8.24.3"

jobs:
  quality:
    name: quality (Node 22)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm -r typecheck

      - name: Test
        run: pnpm -r test

      - name: Build
        run: pnpm -r build

      - name: OpenSpec validate (未归档 changes)
        run: |
          set -euo pipefail
          failed=0
          for dir in openspec/changes/*/; do
            name="$(basename "$dir")"
            [ "$name" = "archive" ] && continue
            echo "==> openspec validate $name --strict"
            if ! npx -y "@fission-ai/openspec@${OPENSPEC_VERSION}" validate "$name" --strict; then
              failed=1
            fi
          done
          exit "$failed"

  api-node20:
    name: api tests (Node 20 下限)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: API tests
        run: pnpm --filter @virtual-biology-lab/api test

  docker-smoke:
    name: docker build smoke (API 镜像)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build API image (不推送)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: false
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

  secret-scan:
    name: 敏感信息硬校验
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: gitleaks detect
        run: |
          set -euo pipefail
          curl -sSfL -o /tmp/gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          /tmp/gitleaks detect --source . --redact --no-banner

      - name: 禁用模式检查
        run: bash scripts/check-forbidden-patterns.sh
        env:
          FORBIDDEN_PATTERNS_EXTRA: ${{ vars.FORBIDDEN_PATTERNS_EXTRA }}
