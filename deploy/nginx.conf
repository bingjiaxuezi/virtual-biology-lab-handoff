# vlab Nginx server 块模板（Phase 2 合入共享 story-admin-web 镜像配置，本次仅入库不启用）
# 约定：web/studio 的 dist 提取到 /usr/share/nginx/vlab-web 与 /usr/share/nginx/vlab-studio；
# 证书沿用现有 acme.sh 体系写入的 /etc/nginx/certs/。
server {
    listen 443 ssl;
    server_name virtual-biology-lab.duckdns.org;  # TODO Phase 2 确定实际域名

    ssl_certificate     /etc/nginx/certs/virtual-biology-lab/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/virtual-biology-lab/privkey.pem;

    client_max_body_size 50m;  # 预留素材上传（具体限额随对象存储方案再定）

    # API 反代（vlab-api 容器在 story-network 内，别名 vlab-api）
    location /api/ {
        proxy_pass http://vlab-api:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 教师端（构建 base = /studio/）
    location /studio/ {
        alias /usr/share/nginx/vlab-studio/;
        try_files $uri $uri/ /studio/index.html;
    }

    # 学生端（根路径）
    location / {
        root /usr/share/nginx/vlab-web;
        try_files $uri $uri/ /index.html;
    }
}

server {
    listen 80;
    server_name virtual-biology-lab.duckdns.org;
    return 301 https://$host$request_uri;
}
