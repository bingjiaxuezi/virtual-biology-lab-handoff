# vlab Nginx server 块模板（与线上 /opt/virtual-biology-lab/nginx-conf/ 保持一致）
# 挂载进共享 story-admin-web 容器：/opt/virtual-biology-lab/nginx-conf → /etc/nginx/conf.d
# 约定：web/studio 的 dist 提取到 /usr/share/nginx/vlab-web 与 /usr/share/nginx/vlab-studio；
# 证书由 acme.sh 体系写入 /etc/nginx/certs/vlab-{fullchain,privkey}.pem。
# 未备案域名在腾讯云 80/443 被拦截，故 HTTP 用 39271、HTTPS 用 39272 非标端口。

# HTTP 入口（IP 直连备用）：http://<server-ip>:39271/
server {
    listen 39271;
    server_name _;

    client_max_body_size 50m;

    location /api/ {
        proxy_pass http://vlab-api:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /studio/ {
        alias /usr/share/nginx/vlab-studio/;
        try_files $uri $uri/ /studio/index.html;
    }

    location / {
        root /usr/share/nginx/vlab-web;
        try_files $uri $uri/ /index.html;
    }
}

# HTTPS 域名入口（推荐）：https://virtual-biology-lab.duckdns.org:39272/
server {
    listen 39272 ssl;
    server_name virtual-biology-lab.duckdns.org;

    ssl_certificate /etc/nginx/certs/vlab-fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/vlab-privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 50m;

    location /api/ {
        proxy_pass http://vlab-api:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /studio/ {
        alias /usr/share/nginx/vlab-studio/;
        try_files $uri $uri/ /studio/index.html;
    }

    location / {
        root /usr/share/nginx/vlab-web;
        try_files $uri $uri/ /index.html;
    }
}
